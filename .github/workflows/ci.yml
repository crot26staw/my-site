# Проверка при каждом пуше: типы и сборка. Сайт теперь Node-приложение с базой данных,
# поэтому GitHub Pages больше не подходит — развёртывание на сервер описано в DEPLOY.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Сборке база не нужна: страницы рендерятся по запросу
      - run: npm run build
